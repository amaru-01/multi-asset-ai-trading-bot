name: Automated Multi-Asset Trading Execution

on:
  schedule:
    # FALLBACK ONLY. The primary trigger is an external timer calling workflow_dispatch
    # at minute 0 of every even UTC hour. This fires 37 minutes later and skips itself
    # if a run already happened in the last 90 minutes.
    - cron: '37 */2 * * *'
  workflow_dispatch:

# Only one trading run at a time; never cancel a run that is mid-trade
concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip fallback run if a run already happened recently
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual and external (workflow_dispatch) runs always execute
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cutoff=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/${{ github.repository }}/actions/workflows/trading_bot.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.created_at > \"$cutoff\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          if [ "$recent" -gt 0 ]; then
            echo "A run already happened in the last 90 minutes; skipping fallback run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository code
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Execution Script
        if: steps.guard.outputs.skip != 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Kill switch and circuit breaker. Set these as repository *variables*
          # (Settings > Secrets and variables > Actions > Variables); no code change
          # or commit is needed to halt new entries. An unset variable is an empty
          # string, which run_execution.py treats as "not halted" / "use the default".
          # A HALT_TRADING file cannot work here: every run starts from a fresh checkout.
          TRADING_HALTED: ${{ vars.TRADING_HALTED }}
          MAX_DAILY_LOSS_PCT: ${{ vars.MAX_DAILY_LOSS_PCT }}
        run: python run_execution.py

      - name: Send Email Notification
        if: always() && steps.guard.outputs.skip != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFICATION_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Trading Bot Execution Report - ${{ job.status }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "GitHub Trading Bot <${{ secrets.NOTIFICATION_EMAIL }}>"
          body: |
            The Multi-Asset Trading Bot workflow completed with status: ${{ job.status }}.

            Repository: ${{ github.repository }}
            Trigger: ${{ github.event_name }}
            Run ID: ${{ github.run_id }}
            View full log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
