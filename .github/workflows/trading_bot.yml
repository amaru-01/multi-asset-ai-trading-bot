name: Automated SPY Trading Execution

on:
  schedule:
    # Runs Mon-Fri at 3:45 PM EST (19:45 UTC during DST / 20:45 UTC standard time)
    - cron: '45 19 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub website

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Execution Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python run_execution.py