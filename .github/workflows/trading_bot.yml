name: Automated Multi-Asset Trading Execution

on:
  schedule:
    - cron: '0 */2 * * *' # Runs at minute 0 of every 2nd hour, 24/7
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Execution Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_execution.py

      - name: Send Email Notification
        if: always() # Sends notification regardless of pass/fail status
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFICATION_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Trading Bot Execution Report - ${{ job.status }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "GitHub Trading Bot <${{ secrets.NOTIFICATION_EMAIL }}>"
          body: |
            The SPY Trading Bot workflow completed with status: ${{ job.status }}.
            
            Repository: ${{ github.repository }}
            Run ID: ${{ github.run_id }}
            View full log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
