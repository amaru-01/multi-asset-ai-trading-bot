name: Automated Multi-Asset Trading Execution

on:
  schedule:
    - cron: '7 */2 * * *' # Every 2 hours, 24/7 (offset to minute 7 to avoid top-of-hour congestion)
  workflow_dispatch:

# Only one trading run at a time; never cancel a run that is mid-trade
concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Execution Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_execution.py

      - name: Send Email Notification
        if: always() # Sends notification regardless of pass/fail status
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFICATION_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Trading Bot Execution Report - ${{ job.status }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "GitHub Trading Bot <${{ secrets.NOTIFICATION_EMAIL }}>"
          body: |
            The Multi-Asset Trading Bot workflow completed with status: ${{ job.status }}.

            Repository: ${{ github.repository }}
            Trigger: ${{ github.event_name }}
            Run ID: ${{ github.run_id }}
            View full log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
