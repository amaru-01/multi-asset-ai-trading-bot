name: Automated Model Retraining

on:
  schedule:
    - cron: '7 0 * * 0' # Sundays at 00:07 UTC (03:07 Nairobi time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-retraining
  cancel-in-progress: false

jobs:
  retrain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain and validate models
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # retrain.py exits non-zero only for real errors (download, training, save,
        # status file). A candidate rejected by the gates is not an error.
        run: python retrain.py

      - name: Commit updated model files
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Model/xgb_trading_model.json Model/xgb_btc_model.json Model/xgb_eth_model.json
          # Per-asset verdicts that run_execution.py reads before opening positions
          if [ -f Model/model_status.json ]; then
            git add Model/model_status.json
          fi
          if git diff --cached --quiet; then
            echo "No model updates to commit."
          else
            git commit -m "Automated weekly model retraining"
            git pull --rebase origin main
            git push origin HEAD:main
          fi