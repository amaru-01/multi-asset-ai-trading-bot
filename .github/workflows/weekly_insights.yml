name: Weekly Insights Newsletter

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly_insights:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly insights
        env:
          TELEGRAM_INSIGHTS_BOT_TOKEN: ${{ secrets.TELEGRAM_INSIGHTS_BOT_TOKEN }}
          TELEGRAM_INSIGHTS_CHAT_ID: ${{ secrets.TELEGRAM_INSIGHTS_CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python weekly_insights.py
