name: Weekly Insights Newsletter

on:
  schedule:
    # FALLBACK ONLY. The primary trigger is an external timer (cron-job.org) calling
    # workflow_dispatch on Sundays at 16:00 UTC = 19:00 Nairobi. This fires 33 minutes
    # later and skips itself if a successful run already happened in the last 180 minutes.
    - cron: '33 16 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-insights
  cancel-in-progress: false

jobs:
  weekly_insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip fallback run if a run already happened recently
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cutoff=$(date -u -d '180 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/${{ github.repository }}/actions/workflows/weekly_insights.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.created_at > \"$cutoff\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          if [ "$recent" -gt 0 ]; then
            echo "A run already happened in the last 180 minutes; skipping fallback run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository code
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly insights
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_INSIGHTS_BOT_TOKEN: ${{ secrets.TELEGRAM_INSIGHTS_BOT_TOKEN }}
          TELEGRAM_INSIGHTS_CHAT_ID: ${{ secrets.TELEGRAM_INSIGHTS_CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m reporting.weekly_insights