name: Crypto Stop-Loss Risk Check

# Triggered by an external timer (cron-job.org calling workflow_dispatch) every 10-15
# minutes. It only checks open crypto positions against their ATR stop and closes any
# that fell through it. It never loads a model, never creates signals and never opens
# a position, so it is safe to run often. There is deliberately no schedule: here a
# missed run is better than GitHub's unreliable cron silently doubling up.
on:
  workflow_dispatch:

# Share the lock with the trading job so the two never submit orders at the same time.
concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  risk-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stop-loss check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_execution.py --risk-only

      # A failing risk check means stops are not being enforced, so say so loudly.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=RISK CHECK FAILED: crypto stop-losses were not checked. ${RUN_URL}" \
              > /dev/null || true
          fi
